[package]
name = "owllisten"
version = "0.1.0"
edition = "2021"

# src-tauri 同时作为 workspace 根：target 目录保持在 src-tauri/target（打包脚本依赖此路径）。
[workspace]
members = ["crates/audioplayer", "crates/waveform"]

[lib]
name = "owllisten_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "owllisten"
path = "src/main.rs"

[dependencies]
audioplayer = { path = "crates/audioplayer" }
waveform = { path = "crates/waveform" }
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误处理
thiserror = "1"
anyhow = "1"
# 日志
log = "0.4"
ffmpeg-next = "8.1.0"
whisper-rs = "0.16.0"
env_logger = "0.11.10"
zip = "8.5.1"
base64 = "0.22.1"
libc = "0.2.186"
cpal = "0.17.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
