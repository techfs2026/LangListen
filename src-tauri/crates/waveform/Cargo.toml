[package]
name = "waveform"
version = "0.1.0"
edition = "2021"
description = "Reusable audio waveform decoding, analysis, and viewport extraction"
readme = "README.md"

[features]
default = ["ffmpeg"]
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
anyhow = "1"
ffmpeg-next = { version = "8.1.0", optional = true }
log = "0.4"
rayon = "1.10"
wide = "1.3.0"
